services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:7077:7077"
    environment:
      NODE_ENV: production
      PORT: "7077"
      HOSTNAME: 0.0.0.0
      SPIRAL_ARCHIVE_DIR: /archive
      OCEAN_SITE_DIR: /ocean
    volumes:
      - ${SPIRAL_ARCHIVE_SITE:-${HOME}/remakes/afifmaahi-portfolio-com-alice-library/site}:/archive:ro
      - ${OCEAN_SITE:-${HOME}/remakes/kdlabcreative-aimirah/site}:/ocean:ro
    restart: unless-stopped
